version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
